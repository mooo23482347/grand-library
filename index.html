<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bücher</title>
  <meta name="description" content="Deine Bücher, Paper, Skripte und Notizen – in Regalen, mit einem Reader zum Lesen ohne Zoomen.">
  <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1511" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bücher">
  <meta name="application-name" content="Bücher">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="assets/fonts/literata-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/library.css">
  <link rel="stylesheet" href="css/reader.css">
  <script>
    // Apply the chosen light/dark mode before the first paint.
    try { const t = localStorage.getItem('buecher.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Zum Inhalt</a>
  <div id="app" class="app">
    <main id="view" class="view" tabindex="-1">
      <div class="boot"><img src="assets/icon-192.png" alt="Bücher wird geladen"></div>
    </main>
  </div>
  <div id="layer-reader"></div>
  <div id="layer-modal"></div>
  <div id="layer-toast" aria-live="polite"></div>
  <noscript><p style="padding:40px;text-align:center">Bücher braucht JavaScript.</p></noscript>
</body>
</html>
